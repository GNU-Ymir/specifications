name: CI

# Builds the book (full three-pass `make refs`) and runs `make check-refs` in the Docker image
# of ./Dockerfile, failing on a broken reference or a missing glyph. The PDF is kept as a
# workflow artifact so a pull request can be proofread without building it locally.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the book
        uses: docker/build-push-action@v7
        with:
          context: .
          target: export
          push: false
          outputs: type=local,dest=out
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/upload-artifact@v7
        with:
          name: ymir-book
          path: out/main.pdf
          if-no-files-found: error
