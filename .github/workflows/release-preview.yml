name: Preview Release

# Rolling pre-release, manually triggered (pick the branch/ref from the "Run workflow" button).
# The tag/release name is the constant `preview`, independent of VERSION: every run replaces the
# previous preview, so there is only ever one preview tag and one preview release. The asset name
# is constant too (ymir-book_preview.pdf), which keeps the download URL stable across runs. The
# name cannot collide with release.yml's bare <version> tags.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview-release:
    runs-on: [self-hosted, linux, x64]
    steps:
      # fetch-depth: 0 so the changelog step below has the history and the tags it walks.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The self-hosted runners have no gh CLI of their own; the release steps below need one.
      - uses: ./.github/actions/setup-gh

      # The preview body. The base is the last real release, never the previous preview: the
      # `preview` tag is rolling (and deleted below), so diffing against it would be meaningless.
      - name: Build release notes
        run: |
          set -euo pipefail

          VERSION="$(tr -d '[:space:]' < VERSION)"
          BASE="$(bash .github/scripts/changelog.sh --print-base)"

          {
            echo "Automated preview of the Ymir book (next version ${VERSION}), built from \`${GITHUB_REF_NAME}\` @ ${GITHUB_SHA}."
            echo "This tag is rolling - it always points at the most recent preview build."
            echo
            if [ -n "$BASE" ]; then
              echo "## What's changed since ${BASE}"
            else
              echo "## What's changed"
            fi
            echo
            bash .github/scripts/changelog.sh --since "$BASE"
            if [ -n "$BASE" ]; then
              echo
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${BASE}...${GITHUB_SHA}"
            fi
          } > "${RUNNER_TEMP}/release-notes.md"

          cat "${RUNNER_TEMP}/release-notes.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v4

      # Same build as the CI workflow: fails on a broken reference or a missing glyph.
      - name: Build the book
        uses: docker/build-push-action@v7
        with:
          context: .
          target: export
          push: false
          outputs: type=local,dest=out
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Replace existing preview tag/release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete preview --yes --cleanup-tag || true

      - name: Publish preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp out/main.pdf ymir-book_preview.pdf
          gh release create preview \
            --target "${{ github.sha }}" \
            --title "Preview" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --prerelease \
            ymir-book_preview.pdf
